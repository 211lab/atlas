baremetal:
  vars:
    ansible_user: control
    ansible_ssh_private_key_file: ~/.ssh/id_rsa_control
    ansible_become: true
    ansible_become_user: root
  hosts:
    turing:
      ansible_host: 10.0.0.101
    hopper:
      ansible_host: 10.0.0.102
    lovelace:
      ansible_host: 10.0.0.103
    babbage:
      ansible_host: 10.0.0.104
    memex:
      ansible_host: 10.0.0.105
    minsky:
      ansible_host: 10.0.0.106

services:
  vars:
    ansible_user: control
    ansible_ssh_private_key_file: ~/.ssh/id_rsa_control
    ansible_become: true
    ansible_become_user: root
  hosts:
    hermes:
      ansible_host: 10.0.10.1

dns:
  vars:
    ansible_user: control
    ansible_ssh_private_key_file: ~/.ssh/id_rsa_control
    ansible_become: true
    ansible_become_user: root
  hosts:
    pihole:
      ansible_host: 10.0.0.10
      hostname: pihole.atlas.lan

local:
  vars:
    ansible_user: wsl
  hosts:
    wsl_local:
      ansible_host: 127.0.0.1
      ansible_connection: local
      ansible_become: true
      ansible_become_method: sudo
