- name: Create control user
  ansible.builtin.user:
    name: control
    shell: /bin/bash
    groups: sudo
    append: yes
    state: present
    create_home: yes
    password_lock: true

- name: Check if visudo is available
  ansible.builtin.stat:
    path: /usr/sbin/visudo
  register: visudo_check

- name: Allow passwordless sudo for control user
  ansible.builtin.copy:
    dest: /etc/sudoers.d/control
    content: "control ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "{{ visudo_check.stat.exists | ternary('visudo -cf %s', omit) }}"

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: /home/control/.ssh
    state: directory
    owner: control
    group: control
    mode: "0700"

- name: Install control server public key
  ansible.builtin.copy:
    src: "{{ lookup('env','HOME') }}/.ssh/id_rsa_control.pub"
    dest: /home/control/.ssh/authorized_keys
    owner: control
    group: control
    mode: "0600"
