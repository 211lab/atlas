# Pi-hole role defaults.
# Override per-host in inventory or via --extra-vars.

# Network
pihole_interface: eth0
pihole_ipv4_address: "{{ ansible_host }}"
pihole_ipv6_address: ""
pihole_hostname: pihole.atlas.lan
pihole_domain: atlas.lan

# Upstream resolvers (fall through when a name is not local)
pihole_upstream_dns_1: 1.1.1.1
pihole_upstream_dns_2: 8.8.8.8

# Behaviour
pihole_query_logging: false
pihole_dnssec: false
pihole_rev_server: false
pihole_blocking_enabled: true

# Memory-lean profile applied via `pihole-FTL --config` (Pi-hole v6). FTL keeps
# the gravity domain set and the DNS cache in memory; these keep the footprint
# small enough for a 256 MiB container. See ansible/docs/proxmox-pihole-lxc.md.
pihole_ftl_settings:
  - { key: "dns.cache.size", value: "2000" }
  - { key: "database.maxDBdays", value: "7" }
  - { key: "database.DBinterval", value: "300" }
  - { key: "dns.queryLogging", value: "false" }
  - { key: "misc.privacylevel", value: "2" }
  - { key: "webserver.threads", value: "10" }

# Web UI. Leave empty to set a random password at install time (read it with
# `pihole setpassword` afterwards). Prefer supplying this from Vault/extra-vars.
pihole_webpassword: ""

# Static local DNS records cooked into the install. Dynamic cluster service
# records are handled by the in-cluster automation (see docs/pihole-dns.md).
pihole_local_records:
  - { ip: "{{ ansible_host }}", names: ["pihole.atlas.lan", "dns.atlas.lan"] }
  - { ip: "10.0.0.1", names: ["router.lan", "gw.lan"] }
