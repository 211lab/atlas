# Pi-hole role defaults.
# Override per-host in inventory or via --extra-vars.

# Network
pihole_interface: eth0
pihole_ipv4_address: "{{ ansible_host }}"
pihole_ipv6_address: ""
pihole_hostname: pihole.atlas.lan
pihole_domain: atlas.lan

# Upstream resolvers (fall through when a name is not local)
pihole_upstream_dns_1: 1.1.1.1
pihole_upstream_dns_2: 8.8.8.8

# Behaviour
pihole_query_logging: true
pihole_dnssec: false
pihole_rev_server: false
pihole_blocking_enabled: true

# Listening mode. `all` = permit all origins, required so off-subnet clients
# (e.g. 10.0.10.0/24 WiFi routed via the router) and tailnet clients are
# answered. `single` restricts answers to eth0 and would break tailnet
# resolution. Installer form is lowercase; FTL form is uppercased below.
pihole_listening_mode: all

# Memory-lean profile applied via `pihole-FTL --config` (Pi-hole v6). FTL keeps
# the gravity domain set and the DNS cache in memory; these keep the footprint
# small enough for a 256 MiB container. See ansible/docs/proxmox-pihole-lxc.md.
pihole_ftl_settings:
  - { key: "dns.cache.size", value: "2000" }
  - { key: "database.maxDBdays", value: "7" }
  - { key: "database.DBinterval", value: "300" }
  - { key: "dns.queryLogging", value: "true" }
  - { key: "misc.privacylevel", value: "2" }
  - { key: "webserver.threads", value: "10" }
  - { key: "dns.listeningMode", value: "{{ pihole_listening_mode | upper }}" }

# Web UI. Leave empty to set a random password at install time (read it with
# `pihole setpassword` afterwards). Prefer supplying this from Vault/extra-vars.
pihole_webpassword: ""

# Static local DNS records cooked into the install. Dynamic cluster service
# records are handled by the in-cluster automation (see docs/pihole-dns.md).
# These are merged into dns.hosts (never replacing what external-dns owns).
pihole_local_records:
  - { ip: "{{ ansible_host }}", names: ["pihole.atlas.lan", "dns.atlas.lan"] }
  - { ip: "10.0.0.1", names: ["router.lan", "gw.lan"] }
  # Proxmox hosts
  - { ip: "10.0.0.101", names: ["turing.atlas.lan"] }
  - { ip: "10.0.0.102", names: ["hopper.atlas.lan"] }
  - { ip: "10.0.0.103", names: ["lovelace.atlas.lan"] }
  - { ip: "10.0.0.104", names: ["babbage.atlas.lan"] }
  - { ip: "10.0.0.105", names: ["memex.atlas.lan"] }
  - { ip: "10.0.0.106", names: ["minsky.atlas.lan"] }
  # Kubernetes API VIP (kube-vip)
  - { ip: "10.0.0.108", names: ["api.atlas.lan"] }
  # Non-k8s services
  - { ip: "10.0.10.24", names: ["homeos.atlas.lan"] }
  - { ip: "10.0.10.26", names: ["truenas.atlas.lan"] }
  - { ip: "10.0.10.1", names: ["hermes.atlas.lan"] }

# Wildcard: any *.atlas.lan name without an explicit record resolves to the
# Traefik ingress nodes via dnsmasq `address=/atlas.lan/<ip>`. Explicit records
# (the dns.hosts entries above and external-dns-managed ones) take precedence,
# so this is "any new service is discoverable" without per-service DNS config.
pihole_wildcard_domain: atlas.lan
pihole_wildcard_targets:
  - 10.0.0.110
  - 10.0.0.111
  - 10.0.0.112
  - 10.0.0.113
pihole_dnsmasq_lines: >-
  {{ ['local=/10.in-addr.arpa/']
     + (pihole_wildcard_targets
        | map('regex_replace', '^(.*)$', 'address=/' ~ pihole_wildcard_domain ~ '/\1')
        | list) }}
