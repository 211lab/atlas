---
# Install and configure a dedicated Pi-hole (v6) DNS server for the lab.
# Idempotent: the upstream installer only runs when Pi-hole is absent.

- name: Ensure installer prerequisites are present
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - dnsutils
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure /etc/pihole exists
  ansible.builtin.file:
    path: /etc/pihole
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check whether Pi-hole is already installed
  ansible.builtin.stat:
    path: /etc/pihole/pihole.toml
  register: pihole_toml

- name: Pre-seed setupVars.conf for the unattended installer
  ansible.builtin.template:
    src: setupVars.conf.j2
    dest: /etc/pihole/setupVars.conf
    owner: root
    group: root
    mode: "0644"
  when: not pihole_toml.stat.exists

- name: Run the Pi-hole unattended installer
  ansible.builtin.shell: |
    set -o pipefail
    curl -sSL https://install.pi-hole.net | bash /dev/stdin --unattended
  args:
    creates: /usr/local/bin/pihole
    executable: /bin/bash
  environment:
    PIHOLE_SKIP_OS_CHECK: "true"
  register: pihole_install
  when: not pihole_toml.stat.exists

- name: Set the web password (when supplied)
  ansible.builtin.command:
    cmd: "pihole setpassword {{ pihole_webpassword }}"
  changed_when: true
  no_log: true
  when:
    - pihole_webpassword | length > 0
    - pihole_install is changed or pihole_toml.stat.exists

- name: Read current Pi-hole FTL settings
  ansible.builtin.command:
    cmd: "pihole-FTL --config {{ item.key }}"
  loop: "{{ pihole_ftl_settings }}"
  register: pihole_ftl_current
  changed_when: false
  failed_when: false

- name: Apply the memory-lean Pi-hole FTL profile
  ansible.builtin.command:
    cmd: "pihole-FTL --config {{ item.item.key }} {{ item.item.value }}"
  loop: "{{ pihole_ftl_current.results }}"
  when: (item.stdout | default('') | trim) != (item.item.value | trim)
  changed_when: true
  notify: Restart pihole-FTL

- name: Re-read critical Pi-hole FTL settings after apply
  ansible.builtin.command:
    cmd: "pihole-FTL --config {{ item.key }}"
  loop:
    - { key: "dns.listeningMode", expected: "{{ pihole_listening_mode | upper }}" }
    - { key: "misc.privacylevel", expected: "0" }
  register: pihole_ftl_verify
  changed_when: false
  failed_when: false

- name: Assert critical Pi-hole FTL settings took effect
  ansible.builtin.assert:
    that:
      - (item.stdout | default('') | trim | upper) == (item.item.expected | upper)
    fail_msg: >-
      Pi-hole FTL setting {{ item.item.key }} is
      '{{ item.stdout | default('') | trim }}' but expected
      '{{ item.item.expected }}'. The role did not apply it.
    success_msg: "{{ item.item.key }} = {{ item.stdout | trim }}"
  loop: "{{ pihole_ftl_verify.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Build Pi-hole v6 static DNS host entries
  ansible.builtin.set_fact:
    pihole_dns_hosts_entries: >-
      {{ pihole_dns_hosts_entries | default([])
         + (record.names | map('regex_replace', '^(.*)$', record.ip ~ ' \1') | list) }}
  loop: "{{ pihole_local_records }}"
  loop_control:
    loop_var: record
  when: pihole_local_records | length > 0

- name: Read current static DNS host entries
  ansible.builtin.command:
    cmd: pihole-FTL --config dns.hosts
  register: pihole_dns_hosts_current
  changed_when: false
  failed_when: false
  when: pihole_local_records | length > 0

# Pi-hole v6 stores custom records in `dns.hosts` (pihole.toml) and regenerates
# /etc/pihole/hosts/custom.list from it, so we configure the source of truth.
# Merge (never replace) so we do not clobber records external-dns owns.
- name: Apply static local DNS records (v6 dns.hosts, merged)
  ansible.builtin.command:
    argv:
      - pihole-FTL
      - --config
      - dns.hosts
      - >-
        {{ (((pihole_dns_hosts_current.stdout | default('[]') | trim)[1:-1]).split(',')
            | map('trim') | select('!=', '') | list
            + pihole_dns_hosts_entries) | unique | to_json }}
  when:
    - pihole_local_records | length > 0
    - >-
      pihole_dns_hosts_entries
      | select('in', pihole_dns_hosts_current.stdout | default(''))
      | list | length
      < pihole_dns_hosts_entries | length
  changed_when: true
  notify: Restart pihole-FTL

- name: Read current dnsmasq lines
  ansible.builtin.command:
    cmd: pihole-FTL --config misc.dnsmasq_lines
  register: pihole_dnsmasq_current
  changed_when: false
  failed_when: false
  check_mode: false
  when: pihole_dnsmasq_lines | length > 0

# Wildcard resolution and the local reverse-DNS rule live in dnsmasq lines,
# rather than dns.hosts (which supports only literal hostnames).
- name: Build merged dnsmasq lines
  ansible.builtin.set_fact:
    pihole_dnsmasq_current_lines: >-
      {{ ((pihole_dnsmasq_current.stdout | default('[]') | trim)[1:-1]).split(',')
         | map('trim') | reject('equalto', '') | list }}

- name: Add desired dnsmasq lines without replacing existing entries
  ansible.builtin.set_fact:
    pihole_dnsmasq_merged_lines: >-
      {{ (pihole_dnsmasq_current_lines + pihole_dnsmasq_lines) | unique | list }}

- name: Apply dnsmasq lines (misc.dnsmasq_lines)
  ansible.builtin.command:
    argv:
      - pihole-FTL
      - --config
      - misc.dnsmasq_lines
      - >-
        {{ pihole_dnsmasq_merged_lines | to_json }}
  when:
    - pihole_dnsmasq_lines | length > 0
    - >-
      pihole_dnsmasq_current_lines != pihole_dnsmasq_merged_lines
  changed_when: true
  notify: Restart pihole-FTL

- name: Ensure Pi-hole FTL service is enabled and running
  ansible.builtin.systemd:
    name: pihole-FTL
    enabled: true
    state: started

- name: Verify DNS answers locally
  ansible.builtin.command:
    cmd: "dig +short @127.0.0.1 {{ pihole_hostname }}"
  register: pihole_self_test
  changed_when: false
  check_mode: false
  retries: 5
  delay: 3
  until: pihole_self_test.stdout | length > 0
  failed_when: false

- name: Report self-test result
  ansible.builtin.debug:
    msg: >-
      {{ pihole_hostname }} -> {{ pihole_self_test.stdout | default('(no answer yet)') }}
