---
- name: Configure hostnames and peer awareness
  hosts: all
  become: true
  vars:
    hosts_file: /etc/hosts

  tasks:
    - name: Determine effective hostname (force .lan)
      ansible.builtin.set_fact:
        fqdn_hostname: >-
          {{ hostvars[inventory_hostname].hostname
             | default(inventory_hostname ~ '.lan') }}
        short_hostname: >-
          {{ (hostvars[inventory_hostname].hostname
              | default(inventory_hostname ~ '.lan'))
              .split('.')[0] }}

    - name: Set system hostname to FQDN
      ansible.builtin.hostname:
        name: "{{ fqdn_hostname }}"

    - name: Build peer hosts list with FQDN + shortname
      ansible.builtin.set_fact:
        peer_hosts: |
          {% for host in groups['all'] %}
          {{ hostvars[host].ansible_host }} {{ hostvars[host].hostname | default(host ~ '.lan') }} {{ (hostvars[host].hostname | default(host ~ '.lan')).split('.')[0] }}
          {% endfor %}

    - name: Update /etc/hosts with peers
      ansible.builtin.copy:
        dest: "{{ hosts_file }}"
        content: |
          127.0.0.1   localhost
          ::1         localhost
          {{ peer_hosts }}
        owner: root
        group: root
        mode: "0644"
