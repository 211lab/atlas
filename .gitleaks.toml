# Gitleaks configuration for the atlas repository.
#
# Extends the upstream default ruleset (API keys, tokens, private keys, generic
# high-entropy assignments, ...) and adds rules for the identities this lab
# treats as sensitive: Tailscale auth keys, tailnet MagicDNS names and tailnet
# (CGNAT 100.64.0.0/10) addresses.
#
# Usage:
#   pre-commit hook:      .githooks/pre-commit
#   full history scan:    gitleaks git --config .gitleaks.toml --redact
#   staged-only scan:     gitleaks git --staged --config .gitleaks.toml --redact

title = "atlas"

[extend]
useDefault = true

# --- Tailscale / tailnet ---------------------------------------------------

[[rules]]
id = "tailscale-auth-key"
description = "Tailscale auth key (tskey-*)"
regex = '''\btskey-[a-z0-9]+-[A-Za-z0-9-]{10,}\b'''
keywords = ["tskey"]

[[rules]]
id = "tailscale-oauth-secret"
description = "Tailscale OAuth client secret"
regex = '''\btskey-client-[A-Za-z0-9-]{20,}\b'''
keywords = ["tskey-client"]

[[rules]]
id = "tailscale-magicdns-host"
description = "Tailscale MagicDNS hostname (*.ts.net)"
regex = '''\b[a-z0-9][a-z0-9-]{2,}\.ts\.net\b'''
keywords = ["ts.net"]

[[rules]]
id = "tailscale-tailnet-ip"
description = "Tailscale tailnet IP address (100.64.0.0/10)"
regex = '''\b100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
keywords = ["100."]

  [[rules.allowlists]]
  description = "MagicDNS service address and the documentation placeholder"
  regexes = ['''100\.100\.100\.100''', '''100\.x\.x\.x''']

# --- Generic credentials ---------------------------------------------------

# Upstream's generic-api-key rule only matches lowercase/digit values, so a
# mixed-case password ("hunter2SuperSecret") slips through. This rule catches
# any literal assignment to a credential-ish key, gated by entropy.

[[rules]]
id = "generic-credential-assignment"
description = "Password/secret/token assigned a literal value"
regex = '''(?i)\b(passwd|password|api[_-]?key|apikey|auth[_-]?token|access[_-]?token|client[_-]?secret|private[_-]?key|bearer[_-]?token|token)\b\s*[:=]\s*["']?([A-Za-z0-9+/_.\-]{8,})["']?'''
secretGroup = 2
entropy = 3.2

  [[rules.allowlists]]
  description = "Kubernetes/Argo CD secret references (name, not value)"
  regexes = [
    '''^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$''',
    '''^[A-Za-z0-9._-]+#[A-Za-z0-9._-]+$''',
  ]

# --- Allowlist -------------------------------------------------------------
#
# gitops/sealed/* holds SealedSecret ciphertext, which is encrypted to the
# cluster's sealing key and safe to publish (the private key never lives here).
# The regexes also permit the well-known MagicDNS service address and the
# 100.x.x.x placeholder used in the docs.

[allowlist]
description = "encrypted SealedSecrets and non-sensitive placeholders"
paths = ['''(^|/)gitops/sealed/''']
regexes = [
  '''Ag[A-Za-z0-9+/]{60,}={0,2}''',
  '''100\.100\.100\.100''',
  '''100\.x\.x\.x''',
]
