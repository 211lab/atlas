name: build
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-push:
    runs-on: ubuntu-latest
    container:
      image: docker:25-git
    env:
      REGISTRY: registry.atlas.lan
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      GITEA_URL: http://gitea-http.gitea.svc.cluster.local:3000
    steps:
      - name: Checkout
        run: |
          git clone "http://oauth2:${REGISTRY_TOKEN}@gitea-http.gitea.svc.cluster.local:3000/atlas-admin/demo-app.git" .

      - name: Configure registry auth
        run: |
          mkdir -p ~/.docker
          AUTH=$(printf '%s:%s' "${REGISTRY_USER}" "${REGISTRY_TOKEN}" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "${REGISTRY}" "${AUTH}" > ~/.docker/config.json

      - name: Build and push
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          echo "Building ${REGISTRY}/atlas-admin/demo-app:${TAG}"
          docker build -t "${REGISTRY}/atlas-admin/demo-app:${TAG}" .
          docker push "${REGISTRY}/atlas-admin/demo-app:${TAG}"
