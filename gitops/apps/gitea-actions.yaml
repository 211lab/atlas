apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-actions
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  sources:
    - repoURL: https://dl.gitea.com/charts
      chart: actions
      targetRevision: 0.1.2
      helm:
        releaseName: gitea-actions
        valueFiles:
          - $values/helm/values/gitea-actions.yaml
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/atlas-admin/atlas.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # This StatefulSet predates Argo ownership. Its live spec retains Kubernetes
  # defaults and Helm-era fields omitted by the chart; ignore only those exact
  # fields so chart-managed runner settings remain compared and reconciled.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: gitea-actions-runner
      namespace: gitea
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/podManagementPolicy
        - /spec/revisionHistoryLimit
        - /spec/serviceName
        - /spec/template/spec/containers/0/terminationMessagePath
        - /spec/template/spec/containers/0/terminationMessagePolicy
        - /spec/template/spec/dnsPolicy
        - /spec/template/spec/initContainers/0/imagePullPolicy
        - /spec/template/spec/initContainers/0/resources
        - /spec/template/spec/initContainers/0/terminationMessagePath
        - /spec/template/spec/initContainers/0/terminationMessagePolicy
        - /spec/template/spec/initContainers/1/livenessProbe/failureThreshold
        - /spec/template/spec/initContainers/1/livenessProbe/periodSeconds
        - /spec/template/spec/initContainers/1/livenessProbe/successThreshold
        - /spec/template/spec/initContainers/1/livenessProbe/timeoutSeconds
        - /spec/template/spec/initContainers/1/startupProbe/failureThreshold
        - /spec/template/spec/initContainers/1/startupProbe/periodSeconds
        - /spec/template/spec/initContainers/1/startupProbe/successThreshold
        - /spec/template/spec/initContainers/1/startupProbe/timeoutSeconds
        - /spec/template/spec/initContainers/1/terminationMessagePath
        - /spec/template/spec/initContainers/1/terminationMessagePolicy
        - /spec/template/spec/schedulerName
        - /spec/template/spec/securityContext
        - /spec/template/spec/terminationGracePeriodSeconds
        - /spec/template/spec/volumes/0/configMap/defaultMode
        - /spec/template/spec/volumes/2/configMap/defaultMode
        - /spec/template/spec/volumes/3/configMap/defaultMode
        - /spec/updateStrategy
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/spec/volumeMode
        - /spec/volumeClaimTemplates/0/status
