apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-actions
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  sources:
    - repoURL: https://dl.gitea.com/charts
      chart: actions
      targetRevision: 0.1.2
      helm:
        releaseName: gitea-actions
        valueFiles:
          - $values/helm/values/gitea-actions.yaml
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/atlas-admin/atlas.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # The StatefulSet was originally helm-installed, so its API-defaulted fields
  # (revisionHistoryLimit, podManagementPolicy, updateStrategy, retention policy)
  # are owned by the stale `helm` managedFields manager and reappear as drift
  # even though the desired manifest never sets them. Ignore fields owned by that
  # manager so the Application reports Synced; the chart values remain the source
  # of truth for everything Argo applies.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      managedFieldsManagers:
        - helm
