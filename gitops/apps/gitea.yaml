apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  sources:
    - repoURL: https://dl.gitea.com/charts
      chart: gitea
      targetRevision: 12.7.0
      helm:
        releaseName: gitea
        valueFiles:
          - $values/helm/values/gitea.yaml
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/atlas-admin/atlas.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
