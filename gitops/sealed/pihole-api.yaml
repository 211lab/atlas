# SealedSecret for the dedicated Pi-hole API/app password.
# NOTE: the committed value is a PLACEHOLDER. Re-seal with the real password:
#   kubeseal --controller-name sealed-secrets-controller \
#     --controller-namespace sealed-secrets --format yaml < plain.yaml > pihole-api.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pihole-api
  namespace: external-dns
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: pihole-api
      namespace: external-dns
    type: Opaque
