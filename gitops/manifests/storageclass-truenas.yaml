# TrueNAS-backed NFS StorageClass for Atlas.
#
# Dedicated dataset and NFS export on TrueNAS (10.0.10.26):
#   dataset: data/atlas-k8s
#   export:  /mnt/data/atlas-k8s  -> 10.0.0.0/24 and 10.0.10.0/24, mapall root
# The csi-driver-nfs provisioner creates a subdirectory per PVC.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-nfs
provisioner: nfs.csi.k8s.io
parameters:
  server: 10.0.10.26
  share: /mnt/data/atlas-k8s
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
