apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: demo-app
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: demo-app
      images:
        - alias: demo
          imageName: registry.atlas.lan/atlas-admin/demo-app
          commonUpdateSettings:
            updateStrategy: semver
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
  writeBackConfig:
    method: git:secret:gitea-writeback
    gitConfig:
      repository: https://git.atlas.lan/atlas-admin/atlas.git
      branch: main
      writeBackTarget: helmvalues:values.yaml
