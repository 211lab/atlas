# Gitea Actions runner helm values (atlas)
# Chart: gitea/actions   Verified: 0.1.2 (runner 2.0.1)
#
# The runner registers and checks out over the in-cluster Gitea service to avoid
# needing the atlas-ca trust bundle and DNS inside job containers. Image builds
# push to the same Gitea registry over the internal service (Kaniko --insecure);
# Argo CD pulls the same repository via the external https://registry.atlas.lan.

enabled: true
giteaRootURL: http://gitea-http.gitea.svc.cluster.local:3000/
existingSecret: gitea-runner-token
existingSecretKey: token

statefulset:
  replicas: 1
  # Argo CD reports API-server-defaulted StatefulSet fields (retention policy,
  # probe/container defaults, volumeClaimTemplates kind) as OutOfSync even
  # though the API server sets them correctly. Ignore live-only fields so the
  # Application stays Synced.
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
  persistence:
    size: 1Gi
  extraVolumes:
    - name: atlas-ca
      configMap:
        name: atlas-ca
    # CI disk hygiene (layers 2+3; see the platform repo's
    # red-operations-platform docs/operations/ci-disk-hygiene.md). The dind
    # sidecar stores images and build cache in its writable layer, which is
    # charged to the node's ephemeral storage: unbounded growth filled
    # atlas-k3s-cp1 on 2026-10-10 and the node went NotReady (the site resolves
    # only to that node). The daemon config enables buildkit's own GC, and the
    # scratch volume moves docker's storage into a pod-scoped emptyDir with a
    # hard size limit, so the runner pod — not the node — absorbs the growth.
    # The ConfigMap is owned by the gitea-runner-hygiene application.
    - name: dind-daemon-config
      configMap:
        name: gitea-dind-daemon-json
    - name: dind-data
      emptyDir:
        # Raised from 15Gi on 2026-10-10: the Odysseus image (~12GiB) plus its
        # build cache peaked above 15Gi and the runner pod was evicted mid-build
        # ("Usage of EmptyDir volume dind-data exceeds the limit 15Gi"). The cap
        # stays bounded so the pod, not the node, absorbs growth; cp1 had ~43GiB
        # free at the time. Revisit if the node's free ephemeral storage drops.
        sizeLimit: 30Gi
  runner:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
  dind:
    # The cockpit `next build` OOM-killed at 1536Mi (2026-10-05). Raise the
    # Docker-in-Docker limit so the RED UI/cockpit images build in CI.
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 4Gi
    extraVolumeMounts:
      - name: atlas-ca
        mountPath: /etc/docker/certs.d/registry.atlas.lan/ca.crt
        subPath: ca.crt
        readOnly: true
      - name: dind-daemon-config
        mountPath: /etc/docker/daemon.json
        subPath: daemon.json
        readOnly: true
      - name: dind-data
        mountPath: /var/lib/docker

global:
  storageClass: truenas-nfs
