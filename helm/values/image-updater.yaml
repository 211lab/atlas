# Argo CD Image Updater helm values (atlas)
# Chart: argo/argocd-image-updater   Verified: 1.3.1
# Watches the Gitea container registry and writes new tags back to git.
config:
  git:
    user: argocd-image-updater
    email: image-updater@atlas.lan
  registries:
    - name: Gitea
      api_url: https://registry.atlas.lan
      prefix: registry.atlas.lan
      ping: yes
      credentials: secret:argocd/gitea-registry-creds#creds
      default: true

extraEnv:
  - name: SSL_CERT_FILE
    value: /certs/ca.crt

volumes:
  - name: atlas-ca
    configMap:
      name: atlas-ca

volumeMounts:
  - name: atlas-ca
    mountPath: /certs
    readOnly: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi
