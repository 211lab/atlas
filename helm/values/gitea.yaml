# Gitea helm values (atlas)
# Chart: gitea/gitea   Verified: 12.7.0 (Gitea 1.27.0)
#
# Storage: stateful data lives on the TrueNAS NFS dataset `data/atlas-k8s`
# via the `truenas-nfs` StorageClass.

gitea:
  admin:
    existingSecret: gitea-admin
  config:
    server:
      DOMAIN: git.atlas.lan
      ROOT_URL: https://git.atlas.lan/
      SSH_DOMAIN: git.atlas.lan
      PROTOCOL: http
    packages:
      ENABLED: true
    registry:
      ENABLED: true
    service:
      DISABLE_REGISTRATION: true
  # DB password is injected from the sealed `gitea-postgresql` secret so the
  # plaintext never lands in git or in the rendered app.ini committed values.
  additionalConfigFromEnvs:
    - name: GITEA__database__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-postgresql
          key: password
  metrics:
    enabled: true

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi

persistence:
  enabled: true
  storageClass: truenas-nfs
  size: 10Gi

postgresql-ha:
  enabled: false
valkey:
  enabled: false
valkey-cluster:
  enabled: false

postgresql:
  enabled: true
  volumePermissions:
    enabled: true
  auth:
    existingSecret: gitea-postgresql
    database: gitea
    username: gitea
  primary:
    extraEnvVars:
      - name: BITNAMI_DEBUG
        value: "true"
    persistence:
      enabled: true
      storageClass: truenas-nfs
      size: 8Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: atlas-ca
  hosts:
    - host: git.atlas.lan
      paths:
        - path: /
          pathType: Prefix
    - host: registry.atlas.lan
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gitea-tls
      hosts:
        - git.atlas.lan
        - registry.atlas.lan
