# Gitea helm values (atlas)
# Chart: gitea/gitea   Verified: 12.7.0 (Gitea 1.27.0)
#
# Storage: stateful data lives on the TrueNAS NFS dataset `data/atlas-k8s`
# via the `truenas-nfs` StorageClass.

gitea:
  admin:
    existingSecret: gitea-admin
  config:
    server:
      DOMAIN: git.atlas.lan
      ROOT_URL: https://git.atlas.lan/
      SSH_DOMAIN: git.atlas.lan
      SSH_PORT: 2222
      SSH_LISTEN_PORT: 2222
      PROTOCOL: http
    packages:
      ENABLED: true
    registry:
      ENABLED: true
    service:
      DISABLE_REGISTRATION: true
  # DB password is injected from the sealed `gitea-postgresql` secret so the
  # plaintext never lands in git or in the rendered app.ini committed values.
  additionalConfigFromEnvs:
    - name: GITEA__database__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-postgresql
          key: password
    # Allow Gitea to deliver push webhooks to the in-cluster Argo CD service.
    - name: GITEA__webhook__ALLOWED_HOST_LIST
      value: "private,argocd-server.argocd.svc.cluster.local"
    - name: GITEA__security__ALLOWED_HOST_LIST
      value: "private,argocd-server.argocd.svc.cluster.local"
  metrics:
    enabled: true

# Single-writer app on a shared PVC: rolling updates deadlock on the leveldb
# lock, so recreate the pod.
strategy:
  type: Recreate

# Gitea (web) container resources.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi

persistence:
  enabled: true
  storageClass: truenas-nfs
  size: 10Gi

# Expose git-over-SSH. Port 2222 avoids the node sshd on 22; k3s ServiceLB
# (svclb) publishes 2222 on every node IP, so clones use:
#   ssh://git@git.atlas.lan:2222/<owner>/<repo>.git
# A dedicated LoadBalancer Service is used (instead of changing the chart's
# gitea-ssh ClusterIP, whose clusterIP is immutable).
extraDeploy:
  - apiVersion: v1
    kind: Service
    metadata:
      name: gitea-ssh-lb
      namespace: gitea
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/instance: gitea
    spec:
      type: LoadBalancer
      selector:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/instance: gitea
      ports:
        - name: ssh
          port: 2222
          targetPort: 2222
          protocol: TCP

postgresql-ha:
  enabled: false
valkey:
  enabled: false
valkey-cluster:
  enabled: false

postgresql:
  enabled: true
  volumePermissions:
    enabled: true
  auth:
    existingSecret: gitea-postgresql
    database: gitea
    username: gitea
  primary:
    persistence:
      enabled: true
      storageClass: truenas-nfs
      size: 8Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: atlas-ca
  hosts:
    - host: git.atlas.lan
      paths:
        - path: /
          pathType: Prefix
    - host: registry.atlas.lan
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gitea-tls
      hosts:
        - git.atlas.lan
        - registry.atlas.lan
