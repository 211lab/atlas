apiVersion: v1
kind: ConfigMap
metadata:
  name: odysseus-searxng-config
data:
  settings.yml.template: |
    use_default_settings: true
    server:
      secret_key: "__SEARXNG_SECRET__"
    search:
      formats:
        - html
        - json
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odysseus-data
spec:
  accessModes: [ReadWriteMany]
  storageClassName: {{ .Values.app.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.app.persistence.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odysseus-chromadb
spec:
  accessModes: [ReadWriteMany]
  storageClassName: {{ .Values.chromadb.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.chromadb.persistence.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odysseus-searxng
spec:
  accessModes: [ReadWriteMany]
  storageClassName: {{ .Values.searxng.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.searxng.persistence.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odysseus-ntfy
spec:
  accessModes: [ReadWriteMany]
  storageClassName: {{ .Values.ntfy.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.ntfy.persistence.size }}
