{{- if .Values.worker.enabled }}
{{- /*
  Background worker (`python -m redops.worker`). Owner decision 2026-10-06: the
  interim fail-on-send connector transport lets the worker start and resume
  durable workflows without a real connector, so it is enabled by default. A
  step that would send raises loudly and its run stays persisted; nothing leaves
  the box. A real connector replaces the transport without a caller change.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redop.fullname" . }}-worker
  labels:
    {{- include "redop.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "redop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "redop.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "redop.fullname" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "redop.workerImage" . }}
          imagePullPolicy: IfNotPresent
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: {{ .Values.postgres.databaseUrlKey }}
            - name: REDOP_WORKER_TENANTS
              value: {{ .Values.worker.tenants | quote }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: OPENROUTER_API_KEY
            - name: BACKEND_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: BACKEND_SHARED_SECRET
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: AUTH_SECRET
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
