apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redop.fullname" . }}-ui
  labels:
    {{- include "redop.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # The previous chart's Deployment used a different immutable selector
    # (`app: redop-ui`). Replace rather than patch so Argo CD can adopt it.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "redop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "redop.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "redop.uiImage" . }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
