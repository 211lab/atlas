apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redop.fullname" . }}-api
  labels:
    {{- include "redop.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # The previous chart's Deployment used a different immutable selector
    # (`app: redop-api`). Replace rather than patch so Argo CD can adopt it.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "redop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "redop.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "redop.fullname" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .Values.migration.enabled }}
      # Migration-before-serve: block the API container until the migration Job
      # reports success. Reads the Job status through the Kubernetes API using
      # the pod's service account (see templates/serviceaccount.yaml).
      initContainers:
        - name: wait-for-migration
          image: {{ include "redop.apiImage" . }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              ns="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              url="https://kubernetes.default.svc/apis/batch/v1/namespaces/${ns}/jobs/{{ include "redop.migrationJobName" . }}"
              i=0
              while [ "$i" -lt 120 ]; do
                code="$(curl -s -o /tmp/job-status -w '%{http_code}' -k \
                  -H "Authorization: Bearer ${token}" "$url" || true)"
                if [ "$code" = "200" ] && grep -Eq '"succeeded"[[:space:]]*:[[:space:]]*[1-9]' /tmp/job-status; then
                  echo "migration complete"
                  exit 0
                fi
                i=$((i + 1))
                echo "waiting for migration (${i}/120)"
                sleep 5
              done
              echo "migration did not complete in time" >&2
              exit 1
      {{- end }}
      containers:
        - name: api
          image: {{ include "redop.apiImage" . }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: {{ .Values.postgres.databaseUrlKey }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: OPENROUTER_API_KEY
            - name: BACKEND_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: BACKEND_SHARED_SECRET
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: AUTH_SECRET
            {{- range $name, $value := .Values.api.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /red/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /red/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- if .Values.api.dataVolume.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.api.dataVolume.mountPath }}
          {{- end }}
      {{- if .Values.api.dataVolume.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.api.dataVolume.claimName }}
      {{- end }}
