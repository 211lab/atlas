{{- if .Values.ingress.enabled }}
{{- /*
  Same-origin ingress (owner decision 2026-10-04; ADR 0012, ADR 0013): `/red/*`
  routes to the RED API and everything else (including `/api/backend/*`) to the
  OpenExecutive cockpit, which owns the root and serves the native
  `/operations/*` RED screens. The Atlas allowlist middleware keeps the host
  internal to the home lab (SPEC.md section 9).
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "redop.fullname" . }}-ipallow
  labels:
    {{- include "redop.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      - {{ .Values.ingress.ipAllowList }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "redop.fullname" . }}
  labels:
    {{- include "redop.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-ipallow@kubernetescrd" .Release.Namespace (include "redop.fullname" .) }}
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Redop
    gethomepage.dev/group: Apps
    gethomepage.dev/description: Redop cockpit
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /red
            pathType: Prefix
            backend:
              service:
                name: {{ include "redop.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /api/backend
            pathType: Prefix
            backend:
              service:
                name: {{ include "redop.fullname" . }}-cockpit
                port:
                  number: {{ .Values.cockpit.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "redop.fullname" . }}-cockpit
                port:
                  number: {{ .Values.cockpit.port }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
{{- end }}
