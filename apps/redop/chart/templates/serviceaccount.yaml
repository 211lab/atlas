apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "redop.fullname" . }}
  labels:
    {{- include "redop.labels" . | nindent 4 }}
---
# The API initContainer polls the migration Job's status through the Kubernetes
# API to enforce migration-before-serve. It needs read access to that one Job
# and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "redop.fullname" . }}-migration-reader
  labels:
    {{- include "redop.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "redop.fullname" . }}-migration-reader
  labels:
    {{- include "redop.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "redop.fullname" . }}-migration-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "redop.fullname" . }}
