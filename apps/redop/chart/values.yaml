apiTag: v0.4.6-redop.2
uiTag: v0.4.6-redop.2

apiImage: registry.atlas.lan/atlas-admin/redop-api
uiImage: registry.atlas.lan/atlas-admin/redop-ui

imagePullSecrets: gitea-registry

execEmail: exec@redop.atlas.lan
defaultModel: openrouter/auto

api:
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 2Gi

ui:
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

persistence:
  enabled: true
  size: 10Gi
  storageClassName: truenas-nfs
  # ADR 0003: persistence is provided by cluster PVs backed by truenas shares.
  # /data keeps OpenExecutive's internal stores (SQLite + ChromaDB); RED's
  # relational store is the PostgreSQL container below, on its own truenas PVC.

postgres:
  image: postgres:16.4-alpine
  port: 5432
  database: redops
  user: redops
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    size: 10Gi
    storageClassName: truenas-nfs

database:
  secretName: redop-postgres
  urlKey: DATABASE_URL

ingress:
  enabled: true
  className: traefik
  host: redop.atlas.lan
  annotations:
    cert-manager.io/cluster-issuer: atlas-ca
    traefik.ingress.kubernetes.io/router.middlewares: redop-redop-ipallow@kubernetescrd
  tlsSecretName: redop-tls
