apiTag: v0.4.6
uiTag: v0.4.6

apiImage: registry.atlas.lan/atlas-admin/redop-api
uiImage: registry.atlas.lan/atlas-admin/redop-ui

imagePullSecrets: gitea-registry

execEmail: exec@redop.atlas.lan
defaultModel: openrouter/auto

api:
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 2Gi

ui:
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

persistence:
  enabled: true
  size: 10Gi
  storageClassName: truenas-nfs

ingress:
  enabled: true
  className: traefik
  host: redop.atlas.lan
  annotations:
    cert-manager.io/cluster-issuer: atlas-ca
    traefik.ingress.kubernetes.io/router.middlewares: redop-redop-ipallow@kubernetescrd
  tlsSecretName: redop-tls
