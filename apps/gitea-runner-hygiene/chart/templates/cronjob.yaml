{{- if .Values.prune.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-dind-prune
  labels:
    app.kubernetes.io/name: gitea-runner-hygiene
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ .Values.prune.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gitea-runner-hygiene
        spec:
          serviceAccountName: gitea-dind-prune
          restartPolicy: Never
          containers:
            # The kubectl image is distroless (no /bin/sh), so the container
            # command is exec-form and the shell runs on the dind side, where
            # the prune sequence executes.
            - name: prune
              image: "{{ .Values.prune.image.repository }}:{{ .Values.prune.image.tag }}"
              command:
                - kubectl
                - -n
                - {{ $.Release.Namespace }}
                - exec
                - {{ .Values.prune.runnerPod }}
                - -c
                - {{ .Values.prune.runnerContainer }}
                - --
                - sh
                - -c
                - >-
                  docker container prune -f;
                  docker image prune -af --filter 'until={{ .Values.prune.imageUnusedFor }}';
                  docker builder prune -af --keep-storage {{ .Values.prune.keepStorage }};
                  docker system df
              resources:
                requests:
                  cpu: {{ .Values.prune.resources.requests.cpu }}
                  memory: {{ .Values.prune.resources.requests.memory }}
                limits:
                  memory: {{ .Values.prune.resources.limits.memory }}
{{- end }}
