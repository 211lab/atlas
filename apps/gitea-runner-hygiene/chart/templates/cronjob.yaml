{{- if .Values.prune.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-dind-prune
  labels:
    app.kubernetes.io/name: gitea-runner-hygiene
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ .Values.prune.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gitea-runner-hygiene
        spec:
          serviceAccountName: gitea-dind-prune
          restartPolicy: Never
          containers:
            - name: prune
              image: "{{ .Values.prune.image.repository }}:{{ .Values.prune.image.tag }}"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  ns="{{ $.Release.Namespace }}"
                  pod="{{ .Values.prune.runnerPod }}"
                  container="{{ .Values.prune.runnerContainer }}"
                  # Every command is individually tolerant: the runner may be busy,
                  # rescheduled or down; the prune retries next hour.
                  kubectl -n "$ns" exec "$pod" -c "$container" -- \
                    docker container prune -f || true
                  kubectl -n "$ns" exec "$pod" -c "$container" -- \
                    docker image prune -af --filter "until={{ .Values.prune.imageUnusedFor }}h" || true
                  kubectl -n "$ns" exec "$pod" -c "$container" -- \
                    docker builder prune -af --keep-storage {{ .Values.prune.keepStorage }} || true
              resources:
                requests:
                  cpu: {{ .Values.prune.resources.requests.cpu }}
                  memory: {{ .Values.prune.resources.requests.memory }}
                limits:
                  memory: {{ .Values.prune.resources.limits.memory }}
{{- end }}
