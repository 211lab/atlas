apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-dind-prune
  labels:
    app.kubernetes.io/name: gitea-runner-hygiene
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-dind-prune
  labels:
    app.kubernetes.io/name: gitea-runner-hygiene
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # `kubectl exec` is a create against pods/exec.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-dind-prune
  labels:
    app.kubernetes.io/name: gitea-runner-hygiene
    app.kubernetes.io/managed-by: {{ .Release.Service }}
subjects:
  - kind: ServiceAccount
    name: gitea-dind-prune
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-dind-prune
