# The Immich database and the extensions Immich requires. Created once the
# CloudNativePG cluster (postgres-cluster.yaml) is available. `app`/`app` is the
# database/owner CloudNativePG bootstraps by default; its credentials are in the
# generated `immich-database-app` secret that Immich consumes.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich-database
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  name: app
  owner: app
  cluster:
    name: immich-database
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: earthdistance
      ensure: present
    - name: cube
      ensure: present
