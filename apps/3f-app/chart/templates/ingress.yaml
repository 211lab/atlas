{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 3f-app
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: 3f-app-api
                port:
                  number: {{ .Values.api.port }}
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: 3f-app-api
                port:
                  number: {{ .Values.api.port }}
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: 3f-app-api
                port:
                  number: {{ .Values.api.port }}
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: 3f-app-api
                port:
                  number: {{ .Values.api.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: 3f-app-api
                port:
                  number: {{ .Values.api.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: 3f-app-web
                port:
                  number: {{ .Values.web.port }}
{{- end }}
