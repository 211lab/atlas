apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      initContainers:
        - name: initialize-config
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - if [ ! -e /config/configuration.yaml ]; then cp /bootstrap/configuration.yaml /config/configuration.yaml && chown 1000:1000 /config/configuration.yaml; fi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: home-assistant
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=4)
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=4)
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=4)
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: bootstrap
          configMap:
            name: home-assistant-config-bootstrap
